schema_version: 1
updated: 2026-09-16
errors:
  - id: math-arithmetic-recall
    subject: Алгебра
    type: prerequisite
    active: true
    description: Таблица умножения и отдельные деления не всегда вспоминаются автоматически; отдельно встречались 7×8 и 72÷9.
    action: Короткая разминка 3–5 минут, затем возвращение к основной теме.

  - id: math-transcription-carelessness
    subject: Алгебра
    type: attention
    active: true
    description: При переносе чисел встречались случайные подмены, например 18→17 и 40→4.
    action: Перед подтверждением ответа отдельно сверять исходные числа и знаки.

  - id: math-unsimplified-fraction
    subject: Алгебра
    type: arithmetic
    active: true
    description: Иногда операция с дробью выполнена верно, но результат не сокращён.
    action: После вычисления задавать отдельный вопрос — можно ли сократить результат?

  - id: math-percent-direction
    subject: Алгебра
    type: concept
    active: true
    description: Смешивались прямое масштабирование и восстановление исходного числа в задачах на проценты.
    action: Перед формулой проговаривать, что известно — целое, часть или процент.

  - id: math-percent-division
    subject: Алгебра
    type: arithmetic
    active: true
    description: 15/60 однажды было оценено как 0.4 вместо 0.25; ошибка вычислительная, а не концептуальная.
    action: Проверять дробь альтернативным способом или прикидкой.

  - id: function-value-vs-minimum
    subject: Алгебра
    type: concept
    active: true
    description: В y=(x−3)²+4 значение 13 при x=0 было принято за минимум функции.
    action: Отдельно различать значение функции в выбранной точке и глобальный/локальный минимум графика.

  - id: domain-boundary-includes-zero
    subject: Алгебра
    type: concept
    active: true
    description: Для √(x−3) граница была записана как x>3 вместо x≥3; забыто, что √0 существует.
    action: При ограничениях проверять саму граничную точку подстановкой.

  - id: equation-expression-zero
    subject: Алгебра
    type: concept
    active: true
    description: В x−4=0 однажды было дано x=0 вместо x=4; смешалось значение переменной и условие, что выражение равно нулю.
    action: Проговаривать: какое значение x делает левое выражение равным правому?

  - id: russian-pos-vs-member
    subject: Русский язык
    type: concept
    active: true
    description: Части речи и члены предложения иногда смешиваются; также нестабильна граница сказуемого и дополнения.
    examples:
      - «старый» было ошибочно принято за наречие и сказуемое; верно — прилагательное + определение.
      - «книгу» было ошибочно принято за наречие; верно — существительное + дополнение.
      - в «Мальчик читает книгу» слово «книгу» однажды было включено в сказуемое.
    action: Для каждого слова отвечать двумя отдельными вопросами — что это за класс слова и какую роль оно выполняет здесь?

  - id: russian-term-recall
    subject: Русский язык
    type: prerequisite
    active: true
    description: Смысл лингвистических идей удерживается лучше, чем названия терминов.
    action: Цикл название → происхождение → точный смысл → собственный пример.

  - id: literature-overclaim
    subject: Литература
    type: reasoning
    active: true
    description: Интерпретация иногда формулируется сильнее, чем позволяет текстовое доказательство.
    action: Перед выводом явно отделять факт текста, интерпретацию и степень уверенности.
