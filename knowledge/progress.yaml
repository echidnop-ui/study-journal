    difficulty: Была одна ошибка в назывании лучей, затем новый пример выполнен верно.
    next: После паузы назвать вершину и лучи нового угла.

  - subject: Геометрия
    topic: Перпендикулярные и параллельные прямые
    type: base
    level: 2
