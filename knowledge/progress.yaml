    difficulty: Готовое общее правило y=(x−a)²+b ещё не проверялось без опоры.
    next: Самостоятельно вывести вершину новой параболы.

  - subject: Геометрия
    topic: Точка, прямая, отрезок и луч
    type: base
    level: 3
    status: practiced
    evidence: Различает объекты; понимает конечность отрезка и направление луча.
    difficulty: Нужна проверка после паузы обозначений луча.
    next: Коротко объяснить различия без определения из учебника.

  - subject: Геометрия
    topic: Угол и его обозначение
    type: base
    level: 3
    status: practiced
