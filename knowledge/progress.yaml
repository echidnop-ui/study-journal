    evidence: Функция понимается как зависимость; запись f(x) и подстановка работают после объяснения.
    difficulty: Терминология удерживается хуже причинной логики; смешивались значение функции и минимум.
    next: Короткая проверка извлечения без конспекта, затем свойства функции.

  - subject: Алгебра
    topic: График функции
    type: program
    curriculum_id: 97
    level: 3
    status: covered
    evidence: Отработаны координатная плоскость, минимум параболы и вертикальные/горизонтальные сдвиги.
    next: Проверить ещё один сдвинутый график после паузы.

  - subject: Алгебра
    topic: Возрастание и убывание функций, монотонность
    type: program
    curriculum_id: 98
    level: 2
    status: explained
    evidence: По таблице значений и графику различает участки до и после вершины.
