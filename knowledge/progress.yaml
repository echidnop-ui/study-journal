  - subject: История
    topic: Революция 1917 года — причины, Февраль и падение монархии
    type: program
    curriculum_id: 30
    level: 3
    status: practiced
    evidence: Самостоятельно восстановлена причинная цепочка: Первая мировая война и перегрузка страны → проблемы снабжения и напряжение → массовые выступления → отказ части гарнизона подавлять протест → потеря властью надёжности аппарата принуждения → падение монархии.
    difficulty: Смысл и причинность удерживаются заметно лучше точных дат и тестовых формулировок.
    next: Через паузу восстановить цепочку без подсказок и закрепить опорные даты короткими карточками.

  - subject: История
    topic: Ключевые даты Февральской революции
    type: assessment_fact
    curriculum_id: 30
    level: 2
    status: practiced
    evidence: Удерживаются 1914 как начало Первой мировой для России и 23 февраля / 8 марта как начало революционных выступлений; дата отречения Николая II вспоминалась после подсказки.
    difficulty: Даты быстро смешиваются; школьный тест требует мелких фактов отдельно от понимания сюжета.
    next: Карточки: 17 февраля — тестовый факт про Путиловский завод; 23 февраля / 8 марта — начало Февральской революции; 27 февраля — массовый переход Петроградского гарнизона; 2 / 15 марта — отречение Николая II.

  - subject: История
    topic: Двоевластие
    type: program
    curriculum_id: 30
    level: 2
    status: practiced
    evidence: Понята конструкция Временное правительство + Петроградский совет и самостоятельно сформулирована слабость: конкурирующие центры власти, разные цепочки подчинения и ненадёжность исполнения решений.
    difficulty: Термин «двоевластие» и его тестовый период март–июль 1917 пока не удерживаются автоматически.
    next: Коротко воспроизвести термин, два центра власти и период март–июль 1917 без вариантов ответа.

  - subject: История
    topic: От Февраля к Октябрю 1917
    type: program
    curriculum_id: 30
    level: 2
    status: explained
    evidence: Разобраны Временное правительство, продолжение войны, возвращение Ленина, Апрельские тезисы, рост влияния большевиков, Июльские дни, Корниловский кризис, роль Керенского и Троцкого и переход к Октябрьскому восстанию.
