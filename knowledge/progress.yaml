  - subject: Алгебра
    topic: Симметрия параболы
    type: base
    level: 3
    status: practiced
    evidence: Самостоятельно замечено равенство значений на одинаковом расстоянии слева и справа от центра.
    next: Объяснить симметрию на новой функции своими словами.

  - subject: Алгебра
    topic: Вершина параболы через минимум квадрата
    type: base
    level: 3
