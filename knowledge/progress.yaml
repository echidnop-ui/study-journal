  - subject: История
    topic: Октябрьская революция
    type: program
    curriculum_id: 30
    level: 1
    status: explained
    evidence: Разобран захват ключевых пунктов Петрограда, роль Военно-революционного комитета, Троцкого и большевиков, падение Временного правительства.
