    next: После паузы определить участки для новой параболы без подсказки.

  - subject: Алгебра
    topic: Чётные и нечётные функции
    type: program
    curriculum_id: 99
    level: 2
    status: practiced
    evidence: Понимает через противоположные входы: одинаковые выходы — чётная, противоположные — нечётная.
    difficulty: Запись f(-x)=±f(x) и функции со сдвигом пока требуют объяснения.
    next: Классифицировать x²−5, x³ и x³+2 через пару значений, затем связать с симметрией графика.

  - subject: Алгебра
    topic: Знак перед квадратом
    type: base
    level: 2
    status: practiced
