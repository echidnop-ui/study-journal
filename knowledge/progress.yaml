records:
  - subject: Алгебра
    topic: Таблица умножения и базовое деление
    type: base
    level: 2
    status: practiced
    difficulty: Автоматизация нестабильна; отдельные произведения и деления вспоминаются не сразу.
    next: Без подсказки вспомнить 7×8 и 56÷8; короткие разминки по 3–5 минут, не отдельная длинная зубрёжка.

  - subject: Алгебра
    topic: Обыкновенные дроби
    type: base
    level: 3
    status: practiced
    evidence: Смысл дроби, общий знаменатель, сложение, вычитание, сокращение и операции восстановлены; деление разбиралось через смысл.
    next: Проверять после пауз; позже вывести правило деления через обратную дробь из смысла.

  - subject: Алгебра
    topic: Десятичные дроби
    type: base
    level: 3
    status: practiced
    evidence: Восстановлены разряды, перевод в обычные дроби и базовые операции.
    next: Позже проверить перевод в обе стороны.

  - subject: Алгебра
    topic: Проценты
    type: base
    level: 2
    status: practiced
    evidence: Разобраны три типа задач; были отдельные арифметические ошибки и одно смешение прямого масштабирования с восстановлением исходного числа.
    difficulty: Положение запятой и порядок часть/целое нестабильны.
    next: Новые задачи на процент от числа, восстановление целого и долю в процентах.

  - subject: Алгебра
    topic: Связи между величинами и определение функции
    type: program
    curriculum_id: 96
    level: 2
