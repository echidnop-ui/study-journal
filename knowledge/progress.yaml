    difficulty: Связи параллельности с углами ещё не проверены.
    next: Проверить на рисунке и перейти к свойствам.

  - subject: Геометрия
    topic: Скрещивающиеся прямые
    type: base
    level: 2
    status: explained
    evidence: Понято, что в пространстве прямые могут не пересекаться, не быть параллельными и не лежать в одной плоскости.
    difficulty: Самостоятельное применение ещё не проверено.
    next: Отличить параллельные от скрещивающихся на новой модели.

  - subject: Геометрия
