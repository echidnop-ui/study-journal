schema_version: 1
updated: 2026-09-16
reviews:
  - subject: Алгебра
    topic: Таблица умножения и деление
    priority: high
    mode: 3-5-minute-drill
    check:
      - 7 × 8
      - 56 ÷ 8
      - 8 × 9
      - 54 ÷ 6

  - subject: Алгебра
    topic: Дроби и проценты
    priority: high
    mode: mixed-recall
    check:
      - 3/5 + 1/10
      - 7/12 ÷ 5/6 с объяснением смысла
      - 0.07 записать обычной дробью
      - 35% от 80
      - 21 — это 70% от какого числа
      - 15 — сколько процентов от 60

  - subject: Алгебра
    topic: Функции и графики
    priority: medium
    curriculum_ids: [96, 97, 98, 99]
    mode: recall-after-pause
    check:
      - своими словами определить функцию
      - объяснить, что показывает график
      - распознать участок возрастания/убывания
      - объяснить чётность/нечётность на простом примере

  - subject: Геометрия
    topic: Базовые объекты и отношения
    priority: high
    mode: prerequisite-check
    check:
      - различить отрезок и луч
      - обозначить угол и назвать вершину
      - определить параллельные и перпендикулярные прямые
      - объяснить, что такое плоскость
      - вспомнить, что значит скрещивание прямых в пространстве

  - subject: Русский язык
    topic: Части речи и члены предложения
    priority: high
    mode: active-recall
    check:
      - своими словами различить часть речи и член предложения
      - разобрать «Старый мужчина медленно открыл дверь» по двум уровням
      - объяснить разницу синтаксиса и семантики
      - привести собственный пример номинализации

  - subject: Русский язык
    topic: Падежи
    priority: medium
    mode: concept-rebuild
    check:
      - объяснить падеж как систему отношений, а не таблицу вопросов
      - различить формы студент / студента / студенту / студентом

  - subject: Литература
    topic: «Гроза» — Катерина
    priority: high
    curriculum_ids: [18]
    mode: continuation
    check:
      - разделить внутренние рамки Катерины и внешние
      - для каждого вывода привести текстовое основание
