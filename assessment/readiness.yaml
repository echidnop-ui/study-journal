schema_version: 1
updated: 2026-09-17
deadline: 2026-10-26
goal: pass_grade_3_or_credit
final_review_start: 2026-10-16

status_scale:
  not_diagnosed: Готовность неизвестна; нет достаточных данных даже для уверенного вывода ниже/выше проходного.
  below_pass: Есть достаточные данные, что текущего уровня не хватает для проходного результата. Это может быть репрезентативная диагностика либо явно подтверждённое отсутствие значительной части обязательной программы; основание нужно записать в known/evidence.
  pass_borderline: Проходной результат уже получен, но без устойчивого запаса.
  pass_with_margin: Проходной результат подтверждён с запасом, желательно более одного раза.
  auto_or_not_required: Отдельная сдача, вероятно, не требуется; статус нужно подтвердить у школы.

rules:
  - Главный показатель до 26 октября — не процент из 230 тем, а способность набрать проходной результат по каждому предмету.
  - Нельзя повышать статус до pass_borderline без полного или достаточно репрезентативного пробника школьного формата.
  - Для below_pass полный пробник не обязателен, если уже достоверно установлено, что значительная часть обязательной программы неизвестна; в таком случае не повторять бессмысленную диагностику и переходить к обучению/ремонту.
  - После каждой диагностики записывать результат, проходной порог, типовые ошибки и ближайший следующий шаг.
  - Приоритет получают предметы below_pass и not_diagnosed; pass_with_margin переводятся в короткое поддерживающее повторение.
  - Глубокое восстановление базы делать только там, где конкретный пробел мешает решать типовые задания.
  - С 16 октября не расширять программу без необходимости: пробники, ошибки, точечное повторение и пересдача слабых форматов.

subjects:
  - subject: Русский язык
    status: not_diagnosed
    study_state: partial
    known: Части речи и члены предложения нестабильны; падежи начаты; тема неологизмов/историзмов/архаизмов уже затрагивалась.
    next: Решить короткую репрезентативную диагностику школьного формата и определить, какие задания дают проходной минимум.

  - subject: Литература
    status: not_diagnosed
    study_state: partial
    known: Идёт «Гроза»; отрабатывается анализ текста, персонажей, конфликта и аргументации.
    next: Проверить формат аттестации и решить типовые вопросы по произведениям/терминам.

  - subject: Иностранный язык
    status: not_diagnosed
    study_state: unknown
    next: Базовая диагностика чтения, лексики и грамматики школьного формата.

  - subject: Алгебра и начала математического анализа
    status: below_pass
    study_state: substantial_gaps
    evidence: Диагностика 17.09 плюс точечная сверка с темами Синергии ID 96–120. Значительная часть обязательных тем неизвестна или неустойчива; тригонометрия ID 110–120 практически с нуля.
    known: Уверенно или близко к уверенно идут простые обыкновенные дроби, базовый порядок действий, простые линейные уравнения, простые квадратные корни, базовый смысл логарифма и часть базовых функций. Неустойчивы действия с отрицательными числами, проценты, буквенные преобразования, показательные уравнения, сдвиги графиков. Не знает композицию функций, корни n-й степени, показательную и логарифмическую функции, преобразования/уравнения с логарифмами; тригонометрия практически с нуля. Нулевая и отрицательная степени уже были начаты в обучении и не считаются чистой диагностикой.
    next: Не проводить повторную общую диагностику. Учить только проходно-значимые темы Синергии ID 96–120 и необходимые предпосылки; затем дать репрезентативный пробник для проверки выхода на pass_borderline.

  - subject: Геометрия
    status: below_pass
    study_state: near_zero
    evidence: Пользователь прямо сообщает, что геометрию практически не знает; из наблюдаемой базы начаты только точка, прямая, отрезок, луч, угол, параллельность/перпендикулярность и плоскость. Программа Синергии ID 76–95 требует стереометрии, многогранников, векторов и координат, которые ещё не изучались.
    known: Начат только фундамент языка геометрии: точка, прямая, отрезок, луч, угол, параллельность, перпендикулярность, плоскость.
    next: Не тратить время на повторную диагностику тем 76–95 как будто уровень неизвестен. Восстановить минимальную базовую планиметрию и сразу связывать её с проходно-значимыми темами Синергии.

  - subject: Вероятность и статистика
    status: not_diagnosed
    study_state: unknown
    next: Проверить, входит ли предмет отдельной аттестацией в текущий список Синергии; если да — диагностировать только её реальные темы/формат.

  - subject: Информатика
    status: not_diagnosed
    study_state: unknown
    next: Диагностика по реальным темам Синергии и формату аттестации.

  - subject: Физика
    status: not_diagnosed
    study_state: unknown
    next: Диагностика строго по темам Синергии ID 129–148: кинематика, динамика, законы сохранения, МКТ, термодинамика, электростатика и постоянный ток.

  - subject: Химия
    status: not_diagnosed
    study_state: unknown
    next: Диагностика строго по темам Синергии ID 61–75.

  - subject: Биология
    status: not_diagnosed
    study_state: unknown
    next: Диагностика строго по темам Синергии ID 43–60.

  - subject: История
    status: not_diagnosed
    study_state: unknown
    next: Диагностика строго по темам Синергии ID 30–42.

  - subject: Обществознание
    status: not_diagnosed
    study_state: unknown
    next: Диагностика строго по темам Синергии.

  - subject: География
    status: not_diagnosed
    study_state: unknown
    next: Диагностика строго по темам Синергии ID 149–163.

  - subject: Физическая культура
    status: not_diagnosed
    study_state: unknown
    next: Сначала выяснить формат аттестации по темам Синергии ID 121–128; затем готовиться непосредственно под него.

  - subject: Основы безопасности и защиты Родины
    status: not_diagnosed
    study_state: unknown
    next: Сначала выяснить формат и реальные темы Синергии; затем готовиться непосредственно под тест.

other:
  - subject: Индивидуальный проект
    status: auto_or_not_required
    note: По прежней информации школы должен закрываться автоматически; требуется подтверждение в личном кабинете.
