schema_version: 1
updated: 2026-09-19
deadline: 2026-10-26
goal: pass_grade_3_or_credit
final_review_start: 2026-10-16

status_scale:
  not_diagnosed: Готовность неизвестна; нет достаточных данных даже для уверенного вывода ниже/выше проходного.
  below_pass: Есть достаточные данные, что текущего уровня не хватает для проходного результата. Это может быть репрезентативная диагностика либо явно подтверждённое отсутствие значительной части обязательной программы; основание нужно записать в known/evidence.
  pass_borderline: Проходной результат уже получен, но без устойчивого запаса.
  pass_with_margin: Проходной результат подтверждён с запасом, желательно более одного раза.
  auto_or_not_required: Отдельная сдача, вероятно, не требуется; статус нужно подтвердить у школы.

rules:
  - Главный показатель до 26 октября — не процент из 230 тем, а способность набрать проходной результат по каждому предмету.
  - Нельзя повышать статус до pass_borderline без полного или достаточно репрезентативного пробника школьного формата.
  - Для below_pass полный пробник не обязателен, если уже достоверно установлено, что значительная часть обязательной программы неизвестна; в таком случае не повторять бессмысленную диагностику и переходить к обучению/ремонту.
  - Пользователь просит считать исходной гипотезой, что по всем школьным предметам текущий уровень ниже проходного, если нет уже полученного доказательства обратного. Не проводить широкую повторную диагностику только ради подтверждения очевидного; использовать точечные проверки внутри обучения и затем репрезентативные пробники для перевода в pass_borderline.
  - После каждой диагностики или пробника записывать результат, проходной порог, типовые ошибки и ближайший следующий шаг.
  - Приоритет получают предметы below_pass; pass_with_margin переводятся в короткое поддерживающее повторение.
  - Глубокое восстановление базы делать только там, где конкретный пробел мешает решать типовые задания.
  - С 16 октября не расширять программу без необходимости: пробники, ошибки, точечное повторение и пересдача слабых форматов.

subjects:
  - subject: Русский язык
    status: below_pass
    study_state: partial
    evidence: Пользователь просит считать текущий уровень по всем школьным предметам ниже проходного, если нет доказательства обратного. По русскому уже наблюдались пробелы в частях речи, членах предложения и падежах; отдельные темы, например неологизмы/историзмы/архаизмы, затрагивались.
    known: Есть отдельные освоенные фрагменты, но системной готовности к аттестации пока нет.
    next: Не проводить широкую диагностику с нуля. Учить и проверять типовые задания по реальным темам Синергии; затем дать репрезентативный пробник.

  - subject: Литература
    status: below_pass
    study_state: partial
    evidence: Пользователь просит считать текущий уровень по всем школьным предметам ниже проходного, если нет доказательства обратного. По литературе идёт работа с «Грозой», но программа 10 класса в целом не закрыта.
    known: Есть начатая работа по анализу текста, персонажей, конфликта и аргументации; полного охвата произведений нет.
    next: Не тратить время на общую диагностику. Закрывать проходно-значимые произведения/термины и формат заданий, затем проверить пробником.

  - subject: Иностранный язык
    status: below_pass
    study_state: partial_or_weak
    evidence: Пользователь просит считать текущий уровень по всем школьным предметам ниже проходного, если нет доказательства обратного. Отдельные базовые фразы на английском получались, но школьная программа Синергии не подтверждена.
    known: Есть отдельные базовые навыки, но готовность к школьной аттестации не подтверждена.
    next: Не проводить длинную общую диагностику. Точечно пройти грамматику и лексику из программы Синергии и затем решить пробник.

  - subject: Алгебра и начала математического анализа
    status: below_pass
    study_state: substantial_gaps
    evidence: Диагностика 17.09 плюс точечная сверка с темами Синергии ID 96–120. Значительная часть обязательных тем неизвестна или неустойчива; тригонометрия ID 110–120 практически с нуля.
    known: Уверенно или близко к уверенно идут простые обыкновенные дроби, базовый порядок действий, простые линейные уравнения, простые квадратные корни, базовый смысл логарифма и часть базовых функций. Неустойчивы действия с отрицательными числами, проценты, буквенные преобразования, показательные уравнения, сдвиги графиков. Не знает композицию функций, корни n-й степени, показательную и логарифмическую функции, преобразования/уравнения с логарифмами; тригонометрия практически с нуля. Нулевая и отрицательная степени уже были начаты в обучении и не считаются чистой диагностикой.
    next: Не проводить повторную общую диагностику. Учить только проходно-значимые темы Синергии ID 96–120 и необходимые предпосылки; затем дать репрезентативный пробник для проверки выхода на pass_borderline.

  - subject: Геометрия
    status: below_pass
    study_state: near_zero
    evidence: Пользователь прямо сообщает, что геометрию практически не знает; из наблюдаемой базы начаты только точка, прямая, отрезок, луч, угол, параллельность/перпендикулярность и плоскость. Программа Синергии ID 76–95 требует стереометрии, многогранников, векторов и координат, которые ещё не изучались.
    known: Начат только фундамент языка геометрии: точка, прямая, отрезок, луч, угол, параллельность, перпендикулярность, плоскость.
    next: Не тратить время на повторную диагностику тем 76–95 как будто уровень неизвестен. Восстановить минимальную базовую планиметрию и сразу связывать её с проходно-значимыми темами Синергии.

  - subject: Вероятность и статистика
    status: below_pass
    study_state: self_reported_below_pass
    evidence: Пользователь просит исходно считать все школьные предметы незнакомыми/ниже проходного, если нет доказательства обратного; отдельной подтверждённой базы по вероятности и статистике пока нет.
    known: Устойчивые навыки по школьной программе не зафиксированы.
    next: Не проводить широкую диагностику. Если предмет входит отдельной аттестацией, сразу пройти реальные темы и типовые задания, затем пробник.

  - subject: Информатика
    status: below_pass
    study_state: self_reported_below_pass
    evidence: Пользователь просит исходно считать все школьные предметы ниже проходного, если нет доказательства обратного. Общая техническая/компьютерная грамотность не считается доказательством готовности именно к школьной программе информатики.
    known: Готовность к формату школьной аттестации не подтверждена.
    next: Не проводить длинную общую диагностику. Сверить реальные темы Синергии, закрыть типовые задания и затем дать пробник.

  - subject: Физика
    status: below_pass
    study_state: near_zero
    evidence: Пользователь прямо сообщает, что физику в школе фактически не изучал и считает свой уровень нулевым. На простом вопросе про 120 км за 2 часа правильно получил 60 км/ч, но это подтверждает базовую арифметику и бытовое понимание скорости, а не владение программой. Синергия ID 129–148 включает кинематику, динамику, законы сохранения, МКТ, термодинамику, электростатику и постоянный ток.
    known: Простое отношение путь/время интуитивно понятно; систематической базы физики нет.
    next: Не проводить повторную общую диагностику ID 129–148. Начинать с минимальных физических величин, единиц и чтения формул, затем идти по проходно-значимым темам Синергии.

  - subject: Химия
    status: below_pass
    study_state: near_zero
    evidence: Пользователь прямо сообщает, что химию точно не знает. Программа Синергии ID 61–75 состоит в основном из органической химии: углеводороды, теория строения Бутлерова, номенклатура, спирты, фенол, углеводы, аминокислоты, белки, полимеры и определение классов/формул веществ.
    known: Систематической школьной базы химии нет.
    next: Не проводить повторную общую диагностику ID 61–75. Начать с минимальной базы: химические элементы, формулы, валентность/связи и чтение структурных формул, затем переходить к проходно-значимым темам органической химии Синергии.

  - subject: Биология
    status: below_pass
    study_state: near_zero
    evidence: Пользователь прямо сообщает, что биологию не знает. Программа Синергии ID 43–60 включает клетку и её химический состав, белки и ферменты, нуклеиновые кислоты и АТФ, обмен веществ, фотосинтез, митоз/мейоз, размножение и генетику.
    known: Систематической школьной базы биологии нет.
    next: Не проводить повторную общую диагностику ID 43–60. Сразу строить минимальный проходной маршрут по темам Синергии, с точечными проверками после изучения блоков.

  - subject: История
    status: below_pass
    study_state: partial
    evidence: 19.09 подробно разобран curriculum_id 30: предпосылки революции 1917 года, Февраль, падение Николая II, двоевластие и путь к Октябрю. Пользователь уверенно восстанавливает основные причинно-следственные связи, но точные даты и мелкие тестовые факты пока нестабильны. Полный курс ID 31–42 ещё не изучен.
    known: Понятны роль Первой мировой, кризиса снабжения и перехода гарнизона; смысл падения аппарата принуждения; конструкция двоевластия; общий путь от Временного правительства к росту большевиков и Октябрьской революции. Тестовые опорные факты требуют интервального повторения.
    next: Закрепить ID 30 коротким тестом и карточками дат/терминов, затем перейти к ID 31 — первые революционные преобразования большевиков. Далее последовательно ID 32–42 в рассказном формате через людей, мотивы, конфликты и причинность; после каждого сюжетного блока — короткий школьный тест.

  - subject: Обществознание
    status: below_pass
    study_state: self_reported_below_pass
    evidence: Пользователь просит считать текущий уровень по всем школьным предметам ниже проходного, если нет доказательства обратного; подтверждённой системной базы по школьной программе обществознания нет.
    known: Отдельные бытовые/общие знания не считаются подтверждением готовности к аттестации.
    next: Не проводить широкую диагностику. Учить определения, признаки, примеры и типовые задания по реальным темам Синергии, затем пробник.

  - subject: География
    status: below_pass
    study_state: self_reported_below_pass
    evidence: Пользователь просит считать текущий уровень по всем школьным предметам ниже проходного, если нет доказательства обратного; подтверждённой системной базы по географии 10 класса нет.
    known: Готовность к темам Синергии ID 149–163 не подтверждена.
    next: Не проводить широкую диагностику. Сразу пройти проходно-значимые темы и типовые задания Синергии, затем пробник.

  - subject: Физическая культура
    status: below_pass
    study_state: self_reported_below_pass
    evidence: Пользователь просит считать текущий уровень по всем школьным предметам ниже проходного, если нет доказательства обратного. Формат отдельной аттестации и требования ещё нужно уточнить.
    known: Готовность к теоретическим/практическим требованиям не подтверждена.
    next: Сначала уточнить формат аттестации по темам Синергии ID 121–128; затем готовиться только под фактические требования.

  - subject: Основы безопасности и защиты Родины
    status: below_pass
    study_state: self_reported_below_pass
    evidence: Пользователь просит считать текущий уровень по всем школьным предметам ниже проходного, если нет доказательства обратного; подтверждённой базы и формата аттестации пока нет.
    known: Готовность к школьной программе не подтверждена.
    next: Сначала уточнить реальные темы и формат Синергии; затем готовиться непосредственно под типовые задания, без широкой предварительной диагностики.

other:
  - subject: Индивидуальный проект
    status: auto_or_not_required
    note: По прежней информации школы должен закрываться автоматически; требуется подтверждение в личном кабинете.
