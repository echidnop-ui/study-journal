schema_version: 1
updated: 2026-09-17
deadline: 2026-10-26
goal: pass_grade_3_or_credit
final_review_start: 2026-10-16

status_scale:
  not_diagnosed: Полный диагностический вариант ещё не решён; готовность к тройке неизвестна.
  below_pass: Диагностика ниже проходного результата.
  pass_borderline: Проходной результат уже получен, но без устойчивого запаса.
  pass_with_margin: Проходной результат подтверждён с запасом, желательно более одного раза.
  auto_or_not_required: Отдельная сдача, вероятно, не требуется; статус нужно подтвердить у школы.

rules:
  - Главный показатель до 26 октября — не процент из 230 тем, а способность набрать проходной результат по каждому предмету.
  - Нельзя повышать статус до pass_borderline без полного или достаточно репрезентативного пробника школьного формата.
  - После каждой диагностики записывать результат, проходной порог, типовые ошибки и ближайший следующий шаг.
  - Приоритет получают предметы below_pass и not_diagnosed; pass_with_margin переводятся в короткое поддерживающее повторение.
  - Глубокое восстановление базы делать только там, где конкретный пробел мешает решать типовые задания.
  - С 16 октября не расширять программу без необходимости: пробники, ошибки, точечное повторение и пересдача слабых форматов.

subjects:
  - subject: Русский язык
    status: not_diagnosed
    study_state: partial
    known: Части речи и члены предложения нестабильны; падежи начаты; тема неологизмов/историзмов/архаизмов уже затрагивалась.
    next: Решить короткую репрезентативную диагностику школьного формата и определить, какие задания дают проходной минимум.

  - subject: Литература
    status: not_diagnosed
    study_state: partial
    known: Идёт «Гроза»; отрабатывается анализ текста, персонажей, конфликта и аргументации.
    next: Проверить формат аттестации и решить типовые вопросы по произведениям/терминам.

  - subject: Иностранный язык
    status: not_diagnosed
    study_state: unknown
    next: Базовая диагностика чтения, лексики и грамматики школьного формата.

  - subject: Алгебра и начала математического анализа
    status: not_diagnosed
    study_state: partial
    known: Диагностика 17.09 в процессе. Уверенно или близко к уверенно идут простые обыкновенные дроби, базовый порядок действий, простые линейные уравнения, простые квадратные корни, базовый смысл логарифма и вершины параболы вида (x-a)^2. Неустойчивы действия с двумя отрицательными числами, умножение десятичных дробей, обратные процентные задачи и изменение величины на процент, показательные уравнения и различение вертикального/горизонтального сдвига графика. Не знает неравенства, квадратные уравнения общего вида, упрощение корней; тригонометрия практически с нуля. Нулевая и отрицательная степени были разобраны во время сессии, поэтому ответы после объяснения не считать исходной диагностикой. Подробности: assessment/algebra-diagnostic-2026-09-17.md.
    next: Продолжить диагностику без объяснения до ответа с вопроса y=(x-4)^2 — куда сдвинута парабола относительно y=x^2; затем пройти оставшиеся репрезентативные типы и только после этого оценивать готовность к проходному результату.

  - subject: Геометрия
    status: not_diagnosed
    study_state: partial
    known: Восстановлены точка, прямая, отрезок, луч, угол, параллельность, перпендикулярность и основы плоскости.
    next: Диагностика базовой планиметрии и тем 10 класса; определить минимальный набор для проходного результата.

  - subject: Вероятность и статистика
    status: not_diagnosed
    study_state: unknown
    next: Проверить событие, исход, простую вероятность, среднее/медиану/размах, таблицы и диаграммы.

  - subject: Информатика
    status: not_diagnosed
    study_state: unknown
    next: Диагностика по информации, кодированию, системам счисления, логике, алгоритмам и таблицам.

  - subject: Физика
    status: not_diagnosed
    study_state: unknown
    next: Диагностика базовых величин, единиц, чтения формул и типовых задач.

  - subject: Химия
    status: not_diagnosed
    study_state: unknown
    next: Диагностика атома, элемента, вещества, формул, периодической таблицы и простых реакций.

  - subject: Биология
    status: not_diagnosed
    study_state: unknown
    next: Диагностика ключевых понятий и типовых заданий по программе 10 класса.

  - subject: История
    status: not_diagnosed
    study_state: unknown
    next: Диагностика хронологии, событий, причин/следствий и типовых вопросов школы.

  - subject: Обществознание
    status: not_diagnosed
    study_state: unknown
    next: Диагностика понятий, признаков и примеров по человеку и обществу, экономике, праву, государству и социальной сфере.

  - subject: География
    status: not_diagnosed
    study_state: unknown
    next: Диагностика карты, населения, ресурсов, хозяйства и причинно-следственных связей.

  - subject: Физическая культура
    status: not_diagnosed
    study_state: unknown
    next: Сначала выяснить формат аттестации; затем готовиться непосредственно под типовые вопросы школы.

  - subject: Основы безопасности и защиты Родины
    status: not_diagnosed
    study_state: unknown
    next: Сначала выяснить формат и перечень тем; затем готовиться непосредственно под тест.

other:
  - subject: Индивидуальный проект
    status: auto_or_not_required
    note: По прежней информации школы должен закрываться автоматически; требуется подтверждение в личном кабинете.
